<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>빈크래프트 — 수집 프로그램</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
<style>
@import url('https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css');
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#33549e;--blue2:#4a78d6;--ink:#0a0a0b;--line:rgba(255,255,255,.1);--dim:rgba(255,255,255,.5)}
body{background:var(--ink);color:#fff;font-family:'NanumSquare','Pretendard',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:74px 40px;letter-spacing:-.01em}
.wrap{width:100%;max-width:1180px}
.kicker{font-family:'Questrial',sans-serif;font-size:12px;letter-spacing:.32em;color:var(--dim);margin-bottom:26px;display:block}
/* 무대: 영상(왼) + 설명(오) */
.stage{display:grid;grid-template-columns:1fr 0fr;gap:0;align-items:center;transition:grid-template-columns 1.9s cubic-bezier(.45,0,.55,1),gap 1.9s cubic-bezier(.45,0,.55,1)}
.stage.split{grid-template-columns:1.05fr .95fr;gap:54px}
/* 영상 화면 — 원본 비율 유지, 전체가 다 보이게(잘림 없음) */
.screen{position:relative;min-width:0;aspect-ratio:1918/946;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#000}
.screen video{width:100%;height:100%;object-fit:contain;display:block}
.screen::after{content:"";position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);pointer-events:none}
/* 설명 패널 */
.panel{min-width:0;opacity:0;transform:translateX(30px);overflow:hidden;transition:opacity 1.1s ease .55s,transform 1.2s cubic-bezier(.16,1,.3,1) .55s}
.stage.split .panel{opacity:1;transform:none}
.panel .ptitle{font-size:clamp(21px,1.8vw,27px);font-weight:800;line-height:1.32;letter-spacing:-.02em;color:#fff;word-break:keep-all}
.panel .bar{width:34px;height:2px;background:var(--blue);margin:18px 0 26px;border-radius:2px}
/* 번호 목록 + 밑줄 스윕(파란→흰) */
.steps{list-style:none;margin:0;padding:0}
.item{position:relative;display:grid;grid-template-columns:auto 1fr;gap:15px;align-items:start;opacity:1;transition:opacity .6s ease}
.item+.item{margin-top:22px}
.panel.relay .item{opacity:.38}
.panel.relay .item.lit{opacity:1}
.num{position:relative;z-index:0;font-family:'Questrial',sans-serif;font-size:15px;line-height:1.7;color:var(--blue2);letter-spacing:.03em;transition:color .6s ease,text-shadow .6s ease}
.num::before{content:"";position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.4);width:42px;height:42px;border-radius:50%;background:radial-gradient(circle,rgba(80,135,240,.5) 0%,rgba(63,134,255,.18) 45%,rgba(63,134,255,0) 72%);opacity:0;transition:opacity .55s ease,transform .7s cubic-bezier(.16,1,.3,1);pointer-events:none;z-index:-1}
.item.lit .num{color:#9dc0ff;text-shadow:0 0 10px rgba(120,165,255,.5)}
.item.lit .num::before{opacity:1;transform:translate(-50%,-50%) scale(1)}
.txwrap{position:relative;min-width:0;padding-bottom:11px}
.tx{display:block;font-size:clamp(14.5px,1.1vw,16.5px);line-height:1.7;color:rgba(255,255,255,.72);word-break:keep-all}
.tx b{color:#fff;font-weight:700}
.ul{position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(255,255,255,.12)}
.ul::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.5);opacity:0;transition:opacity .5s ease}
.ul::after{content:"";position:absolute;inset:0;background:#33549e;transform:scaleX(0);transform-origin:left center;transition:transform 1s cubic-bezier(.45,0,.55,1)}
.ul.on::after{transform:scaleX(1)}
.ul.fold::after{transform-origin:right center;transform:scaleX(0);transition:transform .55s cubic-bezier(.45,0,.55,1)}
.ul.trail::before{opacity:1}
@media(max-width:820px){
  body{padding:54px 24px}
  .stage,.stage.split{grid-template-columns:1fr;gap:0}
  .panel{margin-top:28px;transform:translateY(20px)}
  .stage.split .panel{transform:none}
}
@media(prefers-reduced-motion:reduce){
  .stage{grid-template-columns:1.05fr .95fr;gap:54px}
  .panel{opacity:1;transform:none;transition:none}
  @media(max-width:820px){.stage{grid-template-columns:1fr}}
}
</style>
</head>
<body>
<div class="wrap">
  <span class="kicker">OUR PROCESS</span>
  <div class="stage" id="stage">
    <div class="screen">
      <video src="https://beancraft-sales.netlify.app/collect-demo.mp4" autoplay muted loop playsinline preload="auto"></video>
    </div>
    <div class="panel">
      <h3 class="ptitle">자체 제작 수집 프로그램</h3>
      <div class="bar"></div>
      <ol class="steps">
        <li class="item"><span class="num">01</span><div class="txwrap"><span class="tx">프로그램으로 <b>상가 전문 중개사</b>를 1차 선별합니다.</span><span class="ul"></span></div></li>
        <li class="item"><span class="num">02</span><div class="txwrap"><span class="tx"><b>전국 어디든 직접 방문</b>해 중개사님들과 제휴 미팅을 진행합니다.</span><span class="ul"></span></div></li>
        <li class="item"><span class="num">03</span><div class="txwrap"><span class="tx">의뢰 조건에 맞는 <b>매물부터 창업 마무리까지 전체를 기획</b>합니다.</span><span class="ul"></span></div></li>
      </ol>
    </div>
  </div>
</div>
<script>
(function(){
  var stage=document.getElementById('stage');
  var panel=document.querySelector('.panel');
  var v=stage.querySelector('video');
  function speed(){ try{ v.playbackRate=2.0; }catch(e){} }
  v.addEventListener('loadedmetadata',speed); v.addEventListener('play',speed); v.addEventListener('canplay',speed); speed();

  var items=[].slice.call(panel.querySelectorAll('.item'));
  var uls=items.map(function(it){return it.querySelector('.ul');});
  var SLIDE=950, WAIT=360, FOLD=580, HOLD=1300, RESTART=750, tmr=[];
  function relay(){
    var i=0;
    (function draw(){
      if(i>=uls.length){ tmr.push(setTimeout(reset,HOLD)); return; }
      var u=uls[i]; void u.offsetWidth; u.classList.add('on');                    // 파란 밑줄이 글씨 밑을 지남
      tmr.push(setTimeout(function(){
        u.classList.add('trail'); u.classList.remove('on'); u.classList.add('fold'); // 흰 밑줄 남기고 접힘
        items[i].classList.add('lit');                                             // 그 번호·글씨 켜짐
        i++; tmr.push(setTimeout(draw, FOLD));
      }, SLIDE+WAIT));
    })();
  }
  function reset(){
    uls.forEach(function(u){u.classList.remove('trail');});
    items.forEach(function(it){it.classList.remove('lit');});
    tmr.push(setTimeout(function(){ uls.forEach(function(u){u.classList.remove('on','fold');}); tmr.push(setTimeout(relay, RESTART)); }, 600));
  }

  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){ stage.classList.add('split'); items.forEach(function(it){it.classList.add('lit');}); return; }
  var fired=false;
  function go(){ if(fired) return; fired=true;
    setTimeout(function(){
      stage.classList.add('split');
      panel.classList.add('relay');           // 대기 중 글씨 흐릿하게
      setTimeout(relay, 1500);                // 패널 뜬 뒤 밑줄 스윕 시작
    }, 5000);
  }
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ go(); io.disconnect(); } }); },{threshold:.35});
    io.observe(stage);
  } else { go(); }
})();
</script>
</body>
</html>
