<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>빈크래프트 — 수집 프로그램</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
<style>
@import url('https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css');
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#33549e;--blue2:#4a78d6;--ink:#0a0a0b;--line:rgba(255,255,255,.1)}
html,body{height:100%}
body{background:var(--ink);color:#fff;font-family:'NanumSquare','Pretendard',sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;overflow:hidden;letter-spacing:-.01em}
.stage{position:relative;width:100%;height:100vh;max-height:800px;overflow:hidden}
/* 빈 여백 채우는 은은한 흐림 배경(고정 크기, 투명도만 변함 — 안 버벅임) */
.bg{position:absolute;inset:0;background:url('https://beancraft-sales.netlify.app/collect-poster.jpg') center/cover no-repeat;filter:blur(30px) brightness(.32) saturate(1.1);transform:scale(1.06);z-index:0;opacity:1;transition:opacity .85s ease;pointer-events:none}
.stage.shrunk .bg{opacity:0}
/* 영상 상자: 영상 비율 그대로. 확대→축소는 변형(GPU)으로만 → 부드럽고 안 늘어남 */
.vid{position:absolute;overflow:hidden;background:#000;border-radius:0;transform-origin:0 0;z-index:2;backface-visibility:hidden}
.stage.shrunk .vid{border-radius:16px}
.vid video{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
/* 오른쪽 텍스트: 세로 가운데(영상과 높이 맞음) */
.rightcol{position:absolute;top:0;bottom:0;right:3vw;width:45%;display:flex;flex-direction:column;justify-content:center;opacity:0;transform:translateX(22px);transition:opacity .8s ease .35s,transform .8s cubic-bezier(.2,.7,.2,1) .35s;z-index:1}
.stage.shrunk .rightcol{opacity:1;transform:none}
.hero{font-weight:800;font-size:clamp(28px,3vw,52px);line-height:1.2;letter-spacing:-.025em;color:#fff;word-break:keep-all}
.kicker{font-family:'Questrial',sans-serif;font-size:13px;letter-spacing:.3em;color:rgba(255,255,255,.64);margin:24px 0 15px;display:block}
.ptitle{font-size:clamp(23px,2.2vw,36px);font-weight:800;line-height:1.3;letter-spacing:-.02em;color:#fff;word-break:keep-all}
.bar{width:40px;height:3px;background:var(--blue);margin:18px 0 0;border-radius:2px}
.steps{list-style:none;margin:34px 0 0;padding:0;display:flex;flex-direction:column;gap:30px}
.item{position:relative;display:grid;grid-template-columns:max-content max-content;justify-content:start;gap:18px;align-items:start;opacity:1;transition:opacity .6s ease}
.rightcol.relay .item{opacity:.42}
.rightcol.relay .item.lit{opacity:1}
.num{position:relative;z-index:0;font-family:'Questrial',sans-serif;font-size:20px;line-height:1.55;color:var(--blue2);letter-spacing:.03em;transition:color .6s ease,text-shadow .6s ease}
.num::before{content:"";position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.4);width:58px;height:58px;border-radius:50%;background:radial-gradient(circle,rgba(80,135,240,.5) 0%,rgba(63,134,255,.18) 45%,rgba(63,134,255,0) 72%);opacity:0;transition:opacity .55s ease,transform .7s cubic-bezier(.16,1,.3,1);pointer-events:none;z-index:-1}
.item.lit .num{color:#9dc0ff;text-shadow:0 0 10px rgba(120,165,255,.5)}
.item.lit .num::before{opacity:1;transform:translate(-50%,-50%) scale(1)}
.txwrap{position:relative;min-width:0;padding-bottom:13px}
.tx{display:block;width:27em;font-size:clamp(15px,1.4vw,22px);line-height:1.5;color:rgba(255,255,255,.93);word-break:keep-all;white-space:nowrap}
.tx b{color:#fff;font-weight:700}
.ul{position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(255,255,255,.12)}
.ul::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.5);opacity:0;transition:opacity .5s ease}
.ul::after{content:"";position:absolute;inset:0;background:#33549e;transform:scaleX(0);transform-origin:left center;transition:transform 1s cubic-bezier(.45,0,.55,1)}
.ul.on::after{transform:scaleX(1)}
.ul.fold::after{transform-origin:right center;transform:scaleX(0);transition:transform .55s cubic-bezier(.45,0,.55,1)}
.ul.trail::before{opacity:1}
.note{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);font-size:clamp(12px,1vw,14px);line-height:1.6;color:rgba(255,255,255,.66);word-break:keep-all}
@media(max-width:820px){
  body{overflow:auto;display:block}
  .stage{height:auto;max-height:none;padding:0}
  .bg{display:none}
  .vid{position:relative!important;left:auto!important;top:auto!important;width:100%!important;height:auto!important;transform:none!important;aspect-ratio:1918/876;border-radius:0}
  .rightcol{position:relative;top:auto;bottom:auto;right:auto;width:100%;height:auto;opacity:1;transform:none;padding:26px 20px 30px}
  .item{grid-template-columns:auto 1fr}
  .tx{white-space:normal;width:auto}
  .steps{gap:22px}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg"></div>
  <div class="vid" id="vid">
    <video src="https://beancraft-sales.netlify.app/collect-demo.mp4" poster="https://beancraft-sales.netlify.app/collect-poster.jpg" muted loop playsinline preload="auto"></video>
  </div>
  <div class="rightcol" id="rightcol">
    <div class="rtop">
      <h2 class="hero">매물부터 함께합니다.</h2>
      <span class="kicker">OUR PROCESS</span>
      <h3 class="ptitle">자체 제작 수집 프로그램</h3>
      <div class="bar"></div>
    </div>
    <ol class="steps">
      <li class="item"><span class="num">01</span><div class="txwrap"><span class="tx">프로그램으로 <b>상가 전문 중개사</b>를 1차 선별합니다.</span><span class="ul"></span></div></li>
      <li class="item"><span class="num">02</span><div class="txwrap"><span class="tx"><b>전국 어디든 직접 방문</b>해 중개사님들과 제휴 미팅을 진행합니다.</span><span class="ul"></span></div></li>
      <li class="item"><span class="num">03</span><div class="txwrap"><span class="tx">의뢰 조건에 맞는 <b>매물부터 창업 마무리까지 전체를 기획</b>합니다.</span><span class="ul"></span></div></li>
    </ol>
    <p class="note">추가 비용은 발생하지 않으며, 의뢰 비용에 포함된 서비스입니다.</p>
  </div>
</div>
<script>
(function(){
  var stage=document.getElementById('stage');
  var vid=document.getElementById('vid');
  var rc=document.getElementById('rightcol');
  var v=vid.querySelector('video');
  var AR=1918/876;
  var full='none';
  function layout(){
    if(window.matchMedia('(max-width:820px)').matches){ vid.style.cssText=''; return; }
    var cw=stage.clientWidth, ch=stage.clientHeight;
    var sW=Math.round(cw*0.47), sH=Math.round(sW/AR);
    var sX=Math.round(cw*0.03), sY=Math.round((ch-sH)/2);
    var fW,fH;
    if(cw/ch>AR){ fH=ch; fW=Math.round(ch*AR); } else { fW=cw; fH=Math.round(cw/AR); }
    if(fW>1918){ fW=1918; fH=Math.round(1918/AR); }
    var fX=Math.round((cw-fW)/2), fY=Math.round((ch-fH)/2);
    vid.style.left=sX+'px'; vid.style.top=sY+'px'; vid.style.width=sW+'px'; vid.style.height=sH+'px';
    full='translate('+(fX-sX)+'px,'+(fY-sY)+'px) scale('+(fW/sW)+')';
    if(stage.classList.contains('shrunk')){ vid.style.transform='none'; }
    else { vid.style.transition='none'; vid.style.transform=full; }
  }
  layout();
  var rt; window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(layout,150); });
  function speed(){ try{ v.playbackRate=2.0; }catch(e){} }
  v.addEventListener('loadedmetadata',speed); v.addEventListener('play',speed); v.addEventListener('canplay',speed);
  var items=[].slice.call(rc.querySelectorAll('.item'));
  var uls=items.map(function(it){return it.querySelector('.ul');});
  var SLIDE=880, WAIT=200, FOLD=560;
  function relay(){ var i=0;
    (function draw(){ if(i>=uls.length) return;
      var u=uls[i]; void u.offsetWidth; u.classList.add('on'); items[i].classList.add('lit');
      setTimeout(function(){ u.classList.add('trail'); u.classList.remove('on'); u.classList.add('fold'); i++; setTimeout(draw, FOLD); }, SLIDE+WAIT);
    })();
  }
  var SHRINK_AT=3000, RELAY_AFTER=1400;
  function shrink(){
    void vid.offsetWidth;
    vid.style.transition='transform 1.15s cubic-bezier(.6,.01,.24,1)';
    stage.classList.add('shrunk'); rc.classList.add('relay');
    vid.style.transform='none';
  }
  function startWatch(){ if(startWatch.done) return; startWatch.done=true;
    setTimeout(shrink, SHRINK_AT);
    setTimeout(relay, SHRINK_AT+RELAY_AFTER);
  }
  function go(){ speed(); if(v.play) v.play().catch(function(){});
    v.addEventListener('playing', startWatch);
    v.addEventListener('timeupdate', function(){ if(v.currentTime>0.06) startWatch(); });
    setTimeout(startWatch, 6000);
  }
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){ stage.classList.add('shrunk'); rc.classList.add('relay'); items.forEach(function(it){it.classList.add('lit');}); vid.style.transform='none'; speed(); if(v.play) v.play().catch(function(){}); return; }
  var inView=false, fired=false, io=null;
  function maybeStart(){ if(fired||!inView||document.hidden) return; fired=true; if(io) io.disconnect(); go(); }
  if('IntersectionObserver' in window){ io=new IntersectionObserver(function(es){ inView=es.some(function(e){return e.isIntersecting;}); maybeStart(); },{threshold:.3}); io.observe(stage); } else { inView=true; }
  document.addEventListener('visibilitychange', maybeStart);
  maybeStart();
})();
</script>
</body>
</html>
