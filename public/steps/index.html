<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>빈크래프트 — 창업 순서</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
<style>
@import url('https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css');
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#3f86ff;--ink:#0a0a0b;--line:rgba(255,255,255,.09);--dim:rgba(255,255,255,.42)}
body{background:var(--ink);color:#fff;font-family:'NanumSquare','Pretendard',sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:90px 28px;letter-spacing:-.01em}
.wrap{width:100%;max-width:960px}
/* 헤더 */
.head{display:flex;align-items:center;gap:14px;margin-bottom:9px}
.mark{width:34px;height:34px;flex-shrink:0}
.kicker{font-family:'Questrial',sans-serif;font-size:12px;letter-spacing:.32em;color:var(--dim);font-weight:400}
.title{font-size:44px;font-weight:300;line-height:1.14;letter-spacing:-.025em;margin-bottom:16px}
.title b{font-weight:800}
.lead{font-size:15px;color:var(--dim);font-weight:300;max-width:520px;line-height:1.7}
/* 토글 (은은한 물풍선) */
.seg{position:relative;display:inline-flex;margin:46px 0 0;gap:0}
.seg-ind{position:absolute;bottom:0;height:2px;background:#fff;border-radius:2px;transition:left .6s cubic-bezier(.22,1.3,.4,1),width .6s cubic-bezier(.22,1.3,.4,1),transform .35s ease;will-change:left,width}
.seg-ind::after{content:"";position:absolute;left:50%;top:-2px;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--blue)}
.seg-btn{position:relative;background:none;border:none;color:var(--dim);font-family:inherit;font-size:19px;font-weight:700;padding:0 4px 16px;margin-right:38px;cursor:pointer;transition:color .35s ease;white-space:nowrap}
.seg-btn:last-child{margin-right:0}
.seg-btn.active,.seg-btn:hover{color:#fff}
.hr{height:1px;background:var(--line);margin-top:-1px}
/* 펼침 */
.panels{margin-top:56px}
.panel{max-height:0;overflow:hidden;opacity:0;transition:max-height .7s cubic-bezier(.16,1,.3,1),opacity .5s ease}
.panel.open{max-height:640px;opacity:1}
/* 단계 */
.steps{display:flex;gap:0}
.step{position:relative;flex:1 1 0;min-width:0;padding-right:20px}
.step:last-child{padding-right:0}
.step .no{font-family:'Questrial',sans-serif;font-size:15px;font-weight:400;color:var(--blue);letter-spacing:.04em}
.step .ico{margin:18px 0 16px;color:rgba(255,255,255,.85)}
.step .ico svg{width:24px;height:24px;display:block}
.step .lb{font-size:16px;font-weight:700;color:#fff;line-height:1.4}
.step .tk{position:absolute;top:7px;right:20px;left:38px;height:1px;background:rgba(255,255,255,.12)}
/* 흰 잔상: 네이비가 지나간 뒤 남는 선 */
.step .tk::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.5);opacity:0;transition:opacity .5s ease}
/* 네이비: 왼→오로 뻗었다가, 꽁지(왼쪽)가 오른쪽으로 접히며 흰선을 드러냄. 뻗음·접힘 같은 속도 */
.step .tk::after{content:"";position:absolute;inset:0;background:#33549e;transform:scaleX(0);transform-origin:left center;transition:transform .95s cubic-bezier(.16,1,.3,1)}
.step .tk.on::after{transform:scaleX(1)}
.step .tk.fold::after{transform-origin:right center;transform:scaleX(0)}
.step .tk.trail::before{opacity:1}
@media(prefers-reduced-motion:reduce){.step .tk::before,.step .tk::after{transition:none}}
.step:last-child .tk{display:none}
.step .dot{position:absolute;top:4px;left:0;width:7px;height:7px;border-radius:50%;background:var(--blue);opacity:.9}
.step:not(:first-child) .dot{background:rgba(255,255,255,.28)}
/* CTA */
.cta-row{margin-top:60px;padding-top:34px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.cta-note{font-size:14px;color:rgba(255,255,255,.68);font-weight:400;letter-spacing:0}
.cta{display:inline-flex;align-items:center;gap:12px;background:none;border:1px solid rgba(255,255,255,.5);color:#fff;font-family:inherit;font-size:16px;font-weight:700;text-decoration:none;padding:15px 30px;border-radius:2px;cursor:pointer;transition:background .35s ease,border-color .35s ease,color .35s ease}
.cta .ar{display:inline-flex;transition:transform .35s cubic-bezier(.22,1.3,.4,1);color:var(--blue)}
.cta:hover{background:#fff;color:var(--ink);border-color:#fff}
.cta:hover .ar{transform:translateX(6px);color:var(--ink)}
@media(max-width:760px){
  .title{font-size:32px}
  .seg-btn{font-size:16px;margin-right:26px}
  .steps{flex-wrap:wrap;gap:26px 0}
  .step{flex:1 1 50%;padding-right:14px}
  .step .tk{display:none}
  .cta-row{flex-direction:column-reverse;align-items:stretch}
  .cta{justify-content:center}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="kicker">HOW IT WORKS</span>
  </div>
  <h1 class="title">창업, <b>어떻게 시작하나요</b></h1>
  <p class="lead">지금 상황을 골라주세요. 상황에 맞는 진행 순서를 정리해 드립니다.</p>

  <div class="seg" id="seg">
    <button class="seg-btn active" data-panel="a">매물부터 구해주세요</button>
    <button class="seg-btn" data-panel="b">매물은 구했어요</button>
    <span class="seg-ind" id="ind"></span>
  </div>
  <div class="hr"></div>

  <div class="panels">
    <!-- A -->
    <div class="panel open" data-panel="a">
      <div class="steps">
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">01</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 9.5h8M8 12.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div><div class="lb">상담신청</div></div>
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">02</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M6 3h8l4 4v14H6V3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M14 3v4h4M9 13h6M9 16h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div><div class="lb">의뢰서 작성</div></div>
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">03</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.3" stroke="currentColor" stroke-width="1.5"/><path d="M15.6 15.6L20 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div><div class="lb">매물 수색</div></div>
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">04</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.4 7-11a7 7 0 1 0-14 0c0 4.6 7 11 7 11Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 10l2 2 3.6-3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="lb">매물 선택</div></div>
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">05</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M6 3h8l4 4v14H6V3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M14 3v4h4M9 15l2 2 4-4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="lb">매물 계약</div></div>
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">06</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M5 4v16M5 4h11l-2.5 3.5L16 11H5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></div><div class="lb">디렉팅 시작</div></div>
      </div>
      <div class="cta-row">
        <span class="cta-note">전문 디렉터가 처음부터 함께합니다.</span>
        <a class="cta" href="#" data-cta>상담 신청하기 <span class="ar">→</span></a>
      </div>
    </div>

    <!-- B -->
    <div class="panel" data-panel="b">
      <div class="steps">
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">01</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 9.5h8M8 12.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div><div class="lb">상담신청</div></div>
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">02</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="2.8" stroke="currentColor" stroke-width="1.5"/><circle cx="16" cy="9" r="2.2" stroke="currentColor" stroke-width="1.4"/><path d="M4 19c0-2.7 2.1-4.3 5-4.3s5 1.6 5 4.3M15 19c0-1.9.8-3.1 2.2-3.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div><div class="lb">현장 미팅</div></div>
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">03</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="13" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg></div><div class="lb">서비스 선택</div></div>
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">04</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M6 3h8l4 4v14H6V3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M14 3v4h4M9 15l2 2 4-4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="lb">계약서 작성</div></div>
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">05</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M5 4v16M5 4h11l-2.5 3.5L16 11H5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></div><div class="lb">디렉팅 시작</div></div>
      </div>
      <div class="cta-row">
        <span class="cta-note">이미 매물이 있다면 더 빠르게 시작합니다.</span>
        <a class="cta" href="#" data-cta>상담 신청하기 <span class="ar">→</span></a>
      </div>
    </div>
  </div>
</div>

<script>
var seg=document.getElementById('seg'),ind=document.getElementById('ind');
var btns=[].slice.call(seg.querySelectorAll('.seg-btn'));
var panels=[].slice.call(document.querySelectorAll('.panel'));
var active=seg.querySelector('.seg-btn.active');
function move(b,squish){ ind.style.left=b.offsetLeft+'px'; ind.style.width=b.offsetWidth+'px'; if(squish){ind.style.transform='scaleX(.7)';setTimeout(function(){ind.style.transform='';},180);} }
function setActive(b){ active=b; btns.forEach(function(x){x.classList.toggle('active',x===b);}); var k=b.getAttribute('data-panel'); panels.forEach(function(p){p.classList.toggle('open',p.getAttribute('data-panel')===k);}); move(b,true); startRelay(); }
btns.forEach(function(b){ b.addEventListener('mouseenter',function(){move(b,false);}); b.addEventListener('click',function(){setActive(b);}); });
seg.addEventListener('mouseleave',function(){move(active,false);});
document.querySelectorAll('[data-cta]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();alert('상담신청 페이지로 이동 (실제 사이트에서는 홈페이지 상담 페이지로 연결)');});});

/* 선 순차 진행: 네이비 머리가 1칸→2칸→… 그려지고, 지나간 자리엔 흰선이 남음.
   도착하면 잠깐 뜸 후 다음 칸. 끝까지 흰선이 차면 잠깐 쉬었다가 흰선 사라지고 반복. */
var SLIDE=980, WAIT=760, FOLD=1050, HOLD=950, RESET=650;
var relayTimers=[];
function clearRelay(){ relayTimers.forEach(clearTimeout); relayTimers=[]; document.querySelectorAll('.step .tk').forEach(function(c){c.classList.remove('on','fold','trail');}); }
function startRelay(){
  clearRelay();
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var panel=document.querySelector('.panel.open'); if(!panel) return;
  var conns=[].slice.call(panel.querySelectorAll('.step:not(:last-child) .tk'));
  if(!conns.length) return;
  var i=0;
  function draw(){
    if(i>=conns.length){ relayTimers.push(setTimeout(reset, HOLD)); return; }
    var c=conns[i]; void c.offsetWidth; c.classList.add('on');            // 스르륵: 다음 번호로 뻗음
    relayTimers.push(setTimeout(function(){                               // 도착 후 조용히 대기
      c.classList.add('trail');                                          // 흰선 뒤에 깔기(네이비가 가림)
      c.classList.remove('on'); c.classList.add('fold');                 // 꽁지 접히며 흰선 드러남
      relayTimers.push(setTimeout(function(){ i++; draw(); }, FOLD));    // 접힘 끝 → 다음 칸
    }, SLIDE+WAIT));
  }
  function reset(){
    conns.forEach(function(c){ c.classList.remove('trail'); });          // 흰선 스르륵 사라짐
    relayTimers.push(setTimeout(function(){
      conns.forEach(function(c){ c.classList.remove('on','fold'); });    // 네이비 원위치(안 보임)
      relayTimers.push(setTimeout(startRelay, RESET));
    }, 550));
  }
  draw();
}
function init(){ move(active,false); startRelay(); }
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(init);}
window.addEventListener('load',init); init();
</script>
</body>
</html>
