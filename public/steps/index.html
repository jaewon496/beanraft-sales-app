<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>빈크래프트 — 창업 순서</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');
@font-face{font-family:'Gmarket';font-weight:300;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff') format('woff')}
@font-face{font-family:'Gmarket';font-weight:500;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff')}
@font-face{font-family:'Gmarket';font-weight:700;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff')}
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#3f86ff;--ink:#0a0a0b;--line:rgba(255,255,255,.09);--dim:rgba(255,255,255,.42)}
body{background:var(--ink);color:#fff;font-family:var(--font,'Gmarket','Pretendard',sans-serif);font-weight:500;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:90px 28px;letter-spacing:-.01em}
body.f-gmarket{--font:'Gmarket','Pretendard',sans-serif}
body.f-pretendard{--font:'Pretendard Variable','Pretendard',sans-serif}
body.f-serif{--font:'Gowun Batang',serif;letter-spacing:0}
body.f-plex{--font:'IBM Plex Sans KR','Pretendard',sans-serif}
/* 폰트 미리보기 스위처 (리뷰용, 실제 적용 땐 제거) */
.fontbar{position:fixed;top:18px;right:18px;z-index:50;display:flex;gap:6px;background:rgba(20,20,24,.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);border-radius:100px;padding:5px}
.fontbar button{font-family:'Pretendard Variable','Pretendard',sans-serif;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.55);background:none;border:none;padding:8px 14px;border-radius:100px;cursor:pointer;transition:all .2s}
.fontbar button.on{color:#0a0a0b;background:#fff}
.fontbar button:hover:not(.on){color:#fff}
.wrap{width:100%;max-width:960px}
/* 헤더 */
.head{display:flex;align-items:center;gap:14px;margin-bottom:9px}
.mark{width:34px;height:34px;flex-shrink:0}
.kicker{font-size:12px;letter-spacing:.34em;color:var(--dim);font-weight:500}
.title{font-size:44px;font-weight:300;line-height:1.12;letter-spacing:-.02em;margin-bottom:16px}
.title b{font-weight:700}
.lead{font-size:15px;color:var(--dim);font-weight:300;max-width:520px;line-height:1.7}
/* 토글 (은은한 물풍선) */
.seg{position:relative;display:inline-flex;margin:46px 0 0;gap:0}
.seg-ind{position:absolute;bottom:0;height:2px;background:#fff;border-radius:2px;transition:left .6s cubic-bezier(.22,1.3,.4,1),width .6s cubic-bezier(.22,1.3,.4,1),transform .35s ease;will-change:left,width}
.seg-ind::after{content:"";position:absolute;left:50%;top:-2px;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--blue)}
.seg-btn{position:relative;background:none;border:none;color:var(--dim);font-family:inherit;font-size:19px;font-weight:500;padding:0 4px 16px;margin-right:38px;cursor:pointer;transition:color .35s ease;white-space:nowrap}
.seg-btn:last-child{margin-right:0}
.seg-btn.active,.seg-btn:hover{color:#fff}
.hr{height:1px;background:var(--line);margin-top:-1px}
/* 펼침 */
.panels{margin-top:56px}
.panel{max-height:0;overflow:hidden;opacity:0;transition:max-height .7s cubic-bezier(.16,1,.3,1),opacity .5s ease}
.panel.open{max-height:640px;opacity:1}
/* 단계 */
.steps{display:flex;gap:0}
.step{position:relative;flex:1 1 0;min-width:0;padding-right:20px}
.step:last-child{padding-right:0}
.step .no{font-size:15px;font-weight:500;color:var(--blue);letter-spacing:.04em}
.step .ico{margin:18px 0 16px;color:rgba(255,255,255,.85)}
.step .ico svg{width:24px;height:24px;display:block}
.step .lb{font-size:16px;font-weight:500;color:#fff;line-height:1.4}
.step .tk{position:absolute;top:7px;right:20px;left:38px;height:1px;background:var(--line)}
.step:last-child .tk{display:none}
.step .dot{position:absolute;top:4px;left:0;width:7px;height:7px;border-radius:50%;background:var(--blue);opacity:.9}
.step:not(:first-child) .dot{background:rgba(255,255,255,.28)}
/* CTA */
.cta-row{margin-top:60px;padding-top:34px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.cta-note{font-size:13.5px;color:var(--dim);font-weight:300}
.cta{display:inline-flex;align-items:center;gap:12px;background:none;border:1px solid rgba(255,255,255,.5);color:#fff;font-family:inherit;font-size:16px;font-weight:500;text-decoration:none;padding:15px 30px;border-radius:2px;cursor:pointer;transition:background .35s ease,border-color .35s ease,color .35s ease,padding-right .35s ease}
.cta .ar{display:inline-flex;transition:transform .35s cubic-bezier(.22,1.3,.4,1);color:var(--blue)}
.cta:hover{background:#fff;color:var(--ink);border-color:#fff}
.cta:hover .ar{transform:translateX(6px);color:var(--ink)}
@media(max-width:760px){
  .title{font-size:32px}
  .seg-btn{font-size:16px;margin-right:26px}
  .steps{flex-wrap:wrap;gap:26px 0}
  .step{flex:1 1 50%;padding-right:14px}
  .step .tk{display:none}
  .cta-row{flex-direction:column-reverse;align-items:stretch}
  .cta{justify-content:center}
}
</style>
</head>
<body class="f-gmarket">
<div class="fontbar" id="fontbar">
  <button data-f="f-gmarket" class="on">Gmarket</button>
  <button data-f="f-pretendard">Pretendard</button>
  <button data-f="f-serif">명조</button>
  <button data-f="f-plex">IBM Plex</button>
</div>
<div class="wrap">
  <div class="head">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="#3f86ff" stroke-width="1.1" opacity=".85"><ellipse cx="20" cy="20" rx="3.6" ry="13"/><ellipse cx="20" cy="20" rx="3.6" ry="13" transform="rotate(45 20 20)"/><ellipse cx="20" cy="20" rx="3.6" ry="13" transform="rotate(90 20 20)"/><ellipse cx="20" cy="20" rx="3.6" ry="13" transform="rotate(135 20 20)"/></g><circle cx="20" cy="20" r="2.4" fill="#3f86ff"/></svg>
    <span class="kicker">HOW IT WORKS</span>
  </div>
  <h1 class="title">창업, <b>어떻게 시작하나요</b></h1>
  <p class="lead">지금 상황을 골라주세요. 상황에 맞는 진행 순서를 정리해 드립니다.</p>

  <div class="seg" id="seg">
    <button class="seg-btn active" data-panel="a">매물부터 구해주세요</button>
    <button class="seg-btn" data-panel="b">매물은 구했어요</button>
    <span class="seg-ind" id="ind"></span>
  </div>
  <div class="hr"></div>

  <div class="panels">
    <!-- A -->
    <div class="panel open" data-panel="a">
      <div class="steps">
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">01</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 9.5h8M8 12.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div><div class="lb">상담신청</div></div>
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">02</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M6 3h8l4 4v14H6V3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M14 3v4h4M9 13h6M9 16h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div><div class="lb">의뢰서 작성</div></div>
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">03</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.3" stroke="currentColor" stroke-width="1.5"/><path d="M15.6 15.6L20 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div><div class="lb">희망 지역<br>매물 수색</div></div>
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">04</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.4 7-11a7 7 0 1 0-14 0c0 4.6 7 11 7 11Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 10l2 2 3.6-3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="lb">최종 매물<br>선택</div></div>
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">05</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M6 3h8l4 4v14H6V3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M14 3v4h4M9 15l2 2 4-4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="lb">매물 계약</div></div>
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">06</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M5 4v16M5 4h11l-2.5 3.5L16 11H5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></div><div class="lb">디렉팅 시작</div></div>
      </div>
      <div class="cta-row">
        <span class="cta-note">전문 디렉터가 처음부터 함께합니다.</span>
        <a class="cta" href="#" data-cta>상담 신청하기 <span class="ar">→</span></a>
      </div>
    </div>

    <!-- B -->
    <div class="panel" data-panel="b">
      <div class="steps">
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">01</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 9.5h8M8 12.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div><div class="lb">상담신청</div></div>
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">02</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="2.8" stroke="currentColor" stroke-width="1.5"/><circle cx="16" cy="9" r="2.2" stroke="currentColor" stroke-width="1.4"/><path d="M4 19c0-2.7 2.1-4.3 5-4.3s5 1.6 5 4.3M15 19c0-1.9.8-3.1 2.2-3.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div><div class="lb">현장 미팅</div></div>
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">03</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M6 3h8l4 4v14H6V3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M14 3v4h4M9 15l2 2 4-4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="lb">계약서 작성</div></div>
        <div class="step"><span class="dot"></span><span class="tk"></span><div class="no">04</div><div class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M5 4v16M5 4h11l-2.5 3.5L16 11H5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></div><div class="lb">디렉팅 시작</div></div>
      </div>
      <div class="cta-row">
        <span class="cta-note">이미 매물이 있다면 더 빠르게 시작합니다.</span>
        <a class="cta" href="#" data-cta>상담 신청하기 <span class="ar">→</span></a>
      </div>
    </div>
  </div>
</div>

<script>
var seg=document.getElementById('seg'),ind=document.getElementById('ind');
var btns=[].slice.call(seg.querySelectorAll('.seg-btn'));
var panels=[].slice.call(document.querySelectorAll('.panel'));
var active=seg.querySelector('.seg-btn.active');
function move(b,squish){ ind.style.left=b.offsetLeft+'px'; ind.style.width=b.offsetWidth+'px'; if(squish){ind.style.transform='scaleX(.7)';setTimeout(function(){ind.style.transform='';},180);} }
function setActive(b){ active=b; btns.forEach(function(x){x.classList.toggle('active',x===b);}); var k=b.getAttribute('data-panel'); panels.forEach(function(p){p.classList.toggle('open',p.getAttribute('data-panel')===k);}); move(b,true); }
btns.forEach(function(b){ b.addEventListener('mouseenter',function(){move(b,false);}); b.addEventListener('click',function(){setActive(b);}); });
seg.addEventListener('mouseleave',function(){move(active,false);});
document.querySelectorAll('[data-cta]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();alert('상담신청 페이지로 이동 (실제 사이트에서는 홈페이지 상담 페이지로 연결)');});});
var fbar=document.getElementById('fontbar');
[].slice.call(fbar.querySelectorAll('button')).forEach(function(fb){ fb.addEventListener('click',function(){ document.body.className=fb.getAttribute('data-f'); fbar.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===fb);}); if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){move(active,false);});} setTimeout(function(){move(active,false);},60); }); });
function init(){ move(active,false); }
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(init);}
window.addEventListener('load',init); init();
</script>
</body>
</html>
