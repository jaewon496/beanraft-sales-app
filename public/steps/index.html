<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>빈크래프트 — 창업 순서</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#2b7fff;--blue2:#5a9dff;--bg:#0A0A0A}
body{background:var(--bg);color:#fff;font-family:'Pretendard','Apple SD Gothic Neo','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:70px 20px}
.cs-wrap{width:100%;max-width:1040px}
/* 헤더 */
.cs-head{text-align:center;margin-bottom:42px}
.cs-eyebrow{font-size:12.5px;letter-spacing:.28em;color:var(--blue2);font-weight:700;margin-bottom:14px}
.cs-title{font-size:38px;font-weight:800;letter-spacing:-.02em}
.cs-title b{color:var(--blue)}
.cs-sub{margin-top:12px;font-size:15.5px;color:rgba(255,255,255,.5)}
/* 토글 버튼 (물풍선 슬라이더) */
.cs-toggle{position:relative;display:flex;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:100px;padding:7px;max-width:600px;margin:0 auto 8px}
.cs-slider{position:absolute;top:7px;bottom:7px;border-radius:100px;background:linear-gradient(135deg,var(--blue),#1e6bff);box-shadow:0 10px 30px -6px rgba(43,127,255,.6),inset 0 1px 0 rgba(255,255,255,.25);z-index:0;transition:left .55s cubic-bezier(.34,1.56,.64,1),width .55s cubic-bezier(.34,1.56,.64,1),transform .3s ease;will-change:left,width}
.cs-btn{position:relative;z-index:1;flex:1;border:none;background:transparent;color:rgba(255,255,255,.62);font-family:inherit;font-size:16.5px;font-weight:700;padding:15px 10px;border-radius:100px;cursor:pointer;transition:color .3s ease;white-space:nowrap}
.cs-btn.active,.cs-btn:hover{color:#fff}
/* 펼쳐지는 패널 */
.cs-panels{margin-top:26px}
.cs-panel{max-height:0;overflow:hidden;opacity:0;transform:translateY(-8px);transition:max-height .6s cubic-bezier(.16,1,.3,1),opacity .45s ease,transform .5s cubic-bezier(.16,1,.3,1)}
.cs-panel.open{max-height:760px;opacity:1;transform:translateY(0)}
.cs-card{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:38px 34px 34px}
/* 단계 타임라인 */
.cs-steps{display:flex;align-items:flex-start;justify-content:center;gap:6px;flex-wrap:wrap}
.cs-step{position:relative;flex:1 1 0;min-width:120px;text-align:center;padding-top:6px}
.cs-line{position:absolute;top:32px;left:calc(-50% + 30px);width:calc(100% - 60px);height:2px;background:linear-gradient(90deg,rgba(43,127,255,.15),rgba(43,127,255,.5));z-index:0}
.cs-step:first-child .cs-line{display:none}
.cs-badge{position:relative;z-index:1;width:60px;height:60px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(120% 120% at 30% 25%,#123 0%,#0d1524 100%);border:1.5px solid rgba(43,127,255,.55);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px -8px rgba(43,127,255,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.cs-badge svg{width:26px;height:26px;color:var(--blue2)}
.cs-num{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.cs-slabel{font-size:14.5px;font-weight:700;color:#fff;line-height:1.35}
/* 하단 상담 버튼 */
.cs-cta-wrap{text-align:center;margin-top:34px;padding-top:28px;border-top:1px solid rgba(255,255,255,.07)}
.cs-cta{display:inline-flex;align-items:center;gap:9px;background:linear-gradient(135deg,var(--blue),#1e6bff);color:#fff;font-size:16px;font-weight:800;text-decoration:none;padding:16px 40px;border-radius:100px;box-shadow:0 14px 34px -10px rgba(43,127,255,.7);transition:transform .25s cubic-bezier(.16,1,.3,1),box-shadow .25s ease}
.cs-cta:hover{transform:translateY(-3px);box-shadow:0 20px 44px -10px rgba(43,127,255,.85)}
.cs-cta svg{width:18px;height:18px}
.cs-ctahint{margin-top:12px;font-size:12.5px;color:rgba(255,255,255,.38)}
@media(max-width:720px){
  .cs-title{font-size:29px}
  .cs-btn{font-size:14.5px;padding:14px 6px}
  .cs-steps{gap:18px}
  .cs-step{flex:1 1 40%;min-width:0}
  .cs-line{display:none}
  .cs-card{padding:28px 18px 26px}
}
</style>
</head>
<body>
<div class="cs-wrap">
  <div class="cs-head">
    <div class="cs-eyebrow">CAFE DIRECTOR</div>
    <h2 class="cs-title">간단한 <b>창업 순서</b></h2>
    <p class="cs-sub">지금 상황에 맞게 선택하시면 진행 순서를 보여드려요</p>
  </div>

  <div class="cs-toggle" id="toggle">
    <div class="cs-slider" id="slider"></div>
    <button class="cs-btn active" data-panel="a">매물부터 구해주세요</button>
    <button class="cs-btn" data-panel="b">매물은 구했어요</button>
  </div>

  <div class="cs-panels">
    <!-- A: 매물부터 -->
    <div class="cs-panel open" data-panel="a">
      <div class="cs-card">
        <div class="cs-steps">
          <div class="cs-step"><span class="cs-line"></span><div class="cs-badge"><span class="cs-num">1</span><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 9h8M8 12h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div><div class="cs-slabel">상담신청</div></div>
          <div class="cs-step"><span class="cs-line"></span><div class="cs-badge"><span class="cs-num">2</span><svg viewBox="0 0 24 24" fill="none"><path d="M6 3h8l4 4v14H6V3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 3v4h4M9 13h6M9 16h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div><div class="cs-slabel">의뢰서 작성</div></div>
          <div class="cs-step"><span class="cs-line"></span><div class="cs-badge"><span class="cs-num">3</span><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div><div class="cs-slabel">희망 지역<br>매물 수색</div></div>
          <div class="cs-step"><span class="cs-line"></span><div class="cs-badge"><span class="cs-num">4</span><svg viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.4 7-11a7 7 0 1 0-14 0c0 4.6 7 11 7 11Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 10l2 2 3.5-3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="cs-slabel">최종 매물<br>선택</div></div>
          <div class="cs-step"><span class="cs-line"></span><div class="cs-badge"><span class="cs-num">5</span><svg viewBox="0 0 24 24" fill="none"><path d="M6 3h8l4 4v14H6V3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 15l2 2 4-4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="cs-slabel">매물 계약</div></div>
          <div class="cs-step"><span class="cs-line"></span><div class="cs-badge"><span class="cs-num">6</span><svg viewBox="0 0 24 24" fill="none"><path d="M12 3l2.5 5.6L20.5 9l-4.2 4.3L17.4 20 12 16.8 6.6 20l1.1-6.7L3.5 9l6-.4L12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></div><div class="cs-slabel">디렉팅 시작</div></div>
        </div>
        <div class="cs-cta-wrap">
          <a class="cs-cta" href="#" data-cta><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>상담 신청하기</a>
          <div class="cs-ctahint">전문 디렉터가 처음부터 함께합니다</div>
        </div>
      </div>
    </div>

    <!-- B: 매물은 구했어요 -->
    <div class="cs-panel" data-panel="b">
      <div class="cs-card">
        <div class="cs-steps">
          <div class="cs-step"><span class="cs-line"></span><div class="cs-badge"><span class="cs-num">1</span><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 9h8M8 12h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div><div class="cs-slabel">상담신청</div></div>
          <div class="cs-step"><span class="cs-line"></span><div class="cs-badge"><span class="cs-num">2</span><svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.7"/><circle cx="16" cy="9" r="2.4" stroke="currentColor" stroke-width="1.6"/><path d="M4 19c0-2.8 2.2-4.5 5-4.5s5 1.7 5 4.5M15 19c0-2 .8-3.2 2.2-3.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div><div class="cs-slabel">현장 미팅</div></div>
          <div class="cs-step"><span class="cs-line"></span><div class="cs-badge"><span class="cs-num">3</span><svg viewBox="0 0 24 24" fill="none"><path d="M6 3h8l4 4v14H6V3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 3v4h4M9 15l2 2 4-4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="cs-slabel">계약서 작성</div></div>
          <div class="cs-step"><span class="cs-line"></span><div class="cs-badge"><span class="cs-num">4</span><svg viewBox="0 0 24 24" fill="none"><path d="M12 3l2.5 5.6L20.5 9l-4.2 4.3L17.4 20 12 16.8 6.6 20l1.1-6.7L3.5 9l6-.4L12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></div><div class="cs-slabel">디렉팅 시작</div></div>
        </div>
        <div class="cs-cta-wrap">
          <a class="cs-cta" href="#" data-cta><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>상담 신청하기</a>
          <div class="cs-ctahint">이미 매물이 있다면 더 빠르게 시작합니다</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var toggle=document.getElementById('toggle');
var slider=document.getElementById('slider');
var btns=[].slice.call(toggle.querySelectorAll('.cs-btn'));
var panels=[].slice.call(document.querySelectorAll('.cs-panel'));
var activeBtn=toggle.querySelector('.cs-btn.active');

function moveSlider(btn,squish){
  slider.style.left=btn.offsetLeft+'px';
  slider.style.width=btn.offsetWidth+'px';
  if(squish){ slider.style.transform='scaleY(.86)'; setTimeout(function(){slider.style.transform='';},170); }
}
function setActive(btn){
  activeBtn=btn;
  btns.forEach(function(b){b.classList.toggle('active',b===btn);});
  var key=btn.getAttribute('data-panel');
  panels.forEach(function(p){p.classList.toggle('open',p.getAttribute('data-panel')===key);});
  moveSlider(btn,true);
}
btns.forEach(function(b){
  b.addEventListener('mouseenter',function(){ moveSlider(b,false); });
  b.addEventListener('click',function(){ setActive(b); });
});
toggle.addEventListener('mouseleave',function(){ moveSlider(activeBtn,false); });
document.querySelectorAll('[data-cta]').forEach(function(a){ a.addEventListener('click',function(e){ e.preventDefault(); alert('상담신청 페이지로 이동 (실제 사이트에서는 홈페이지 상담 페이지로 연결)'); }); });
window.addEventListener('load',function(){ moveSlider(activeBtn,false); });
moveSlider(activeBtn,false);
</script>
</body>
</html>
